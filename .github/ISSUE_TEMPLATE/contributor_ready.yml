name: Contributor-ready task
description: A scoped task a first-time contributor (or their coding agent) can pick up
title: "[TASK] "
labels: ["good-first-issue", "ai-friendly"]
body:
  - type: markdown
    attributes:
      value: |
        Maintainers and reporters: use this form for a task that is ready to be picked up. A contributor claims it by commenting on the issue; see [CONTRIBUTING.md](https://github.com/graphistry/pygraphistry/blob/develop/CONTRIBUTING.md) (coding agents follow `.agents/skills/contribute/SKILL.md`).
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What changes, in one or two sentences, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can verify.
      placeholder: |
        - [ ] ...
        - [ ] A test that fails before the change and passes after
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Where to look
      description: The paths in scope (and any out of scope), the functions, and the existing tests to copy. Name the test file the new test belongs in.
    validations:
      required: true
  - type: input
    id: failing_test
    attributes:
      label: The test that should fail first
      description: "Name it (`path::test_name`) or describe the case: it fails on `develop` today and passes with the fix."
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks to run
      description: Fast first, then the full set before pushing.
      value: |
        Fast: `./bin/pytest.sh <the test file>` (GFQL: `./bin/check-gfql.sh --changed`)
        Full before pushing: `./bin/lint.sh`, `./bin/typecheck.sh`, `./bin/check-gfql.sh`
  - type: dropdown
    id: engines
    attributes:
      label: Engines affected
      description: Which GFQL engines the change can touch (GPU engines can be left to maintainers).
      multiple: true
      options:
        - pandas
        - Polars (CPU)
        - cuDF
        - polars-gpu
        - not GFQL
  - type: input
    id: size
    attributes:
      label: Expected size
      placeholder: "e.g. one function, about 30 lines plus a test"

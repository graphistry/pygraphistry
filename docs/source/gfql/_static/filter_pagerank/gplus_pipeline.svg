<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="GPlus: 107,614 nodes / 30M edges">
<title>GPlus: 107,614 nodes / 30M edges</title>
<style>.c{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--rule:#dcdbd6;--track:#f0efec;--neo:#eb6834;--cpu:#2a78d6;--gpu:#1baf7a}@media (prefers-color-scheme:dark){.c{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#908f86;--rule:#3b3a37;--track:#262523;--neo:#d95926;--cpu:#3987e5;--gpu:#199e70}}.c text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.t{font-size:17px;font-weight:600;fill:var(--ink)}.s{font-size:12.5px;fill:var(--ink2)}.n{font-size:13px;font-weight:600;fill:var(--ink)}.a{font-size:12.5px;fill:var(--ink2)}.m{font-size:12.5px;fill:var(--ink3)}.neo{fill:var(--neo)}.cpu{fill:var(--cpu)}.gpu{fill:var(--gpu)}</style>
<g class="c">
<rect width="720" height="290" fill="var(--surface)"/>
<text class="t" x="16" y="28">GPlus: 107,614 nodes / 30M edges</text>
<text class="s" x="16" y="49">Warm pipeline — search, PageRank, search — on the resident graph. Lower is better.</text>
<rect x="16" y="74" width="1" height="172" fill="var(--rule)"/>
<text class="a" x="17" y="85">Neo4j + GDS</text>
<rect x="16.5" y="94.5" width="424" height="24" rx="4" fill="var(--track)" stroke="var(--rule)" stroke-dasharray="5 4"/>
<text class="m" x="28" y="111">did not complete — no timing exists</text>
<text class="a" x="17" y="147">GFQL Cypher on CPU (pandas + igraph)</text>
<path class="cpu" d="M16 156H436a4 4 0 0 1 4 4V176a4 4 0 0 1 -4 4H16Z"/>
<text x="450" y="173"><tspan class="n">32.10 s</tspan></text>
<text class="a" x="17" y="209">GFQL Cypher on GPU (cuDF + cuGraph)</text>
<path class="gpu" d="M16 218H44a4 4 0 0 1 4 4V238a4 4 0 0 1 -4 4H16Z"/>
<text x="58" y="235"><tspan class="n">2.42 s</tspan><tspan class="a" dx="11">13.3x faster than the CPU path</tspan></text>
<text class="m" x="16" y="279">Neo4j lost its Bolt connection mid-transaction on the first warmup iteration; no GPlus figure exists.</text>
</g></svg>
